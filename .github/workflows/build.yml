name: Build Plugin

# 独立构建 Claude Code 状态监控插件（无需主程序解决方案）。
# windows-latest 的 runner 自带 VS2022 + MFC，本机即使没装 MFC 也能在云端构建。
on:
  workflow_dispatch:          # 允许在 Actions 页面手动触发
  push:                       # 每次 push 自动构建
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64     # 64 位 TrafficMonitor 用这个
          - platform: Win32   # 32 位 TrafficMonitor 用这个

    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build plugin
        run: msbuild ClaudeCodeMonitor.vcxproj -p:Configuration=Release -p:Platform=${{ matrix.platform }} -p:platformToolset=v143 -m

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeCodeMonitor_${{ matrix.platform }}
          path: Bin/${{ matrix.platform }}/Release/ClaudeCodeMonitor.dll
          if-no-files-found: error
